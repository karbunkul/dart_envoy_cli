---
version: 1
exec: echo "App is running on branch $GIT_BRANCH"

variables:
  - name: PORT
    summary: Port to listen on
    constraint: portRange
    castTo: int

  - name: DEBUG_MODE
    summary: Enable debug mode
    castTo: boolean

  - name: BASE_AUTH
    summary: Username and password for basic auth
    castTo: string
    constraints:
      pattern: "^.+:.+$"

  - name: GIT_BRANCH
    summary: Current git branch
    virtual:
      exec: git rev-parse --abbrev-ref HEAD

  - name: PWD
    summary: Current working directory
    exec:
      linux: pwd
      darwin: pwd
      windows: dir

constraints:
  - name: portRange
    rules:
      minimum: 1024
      maximum: 65535

templates:
  - output: dist/config.dart
    template: templates/config.tpl

  - output: dist/config.json
    json:
      fields:
        - PORT
        - DEBUG_MODE
        - GIT_BRANCH
        - PWD